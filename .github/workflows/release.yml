name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v3.0.0-alpha2.105

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
      - name: Build Linux packages
        run: |
          "$(go env GOPATH)/bin/wails3" task linux:create:deb
          tar -czf bin/LocalTodo-linux-amd64.tar.gz -C bin localtodo
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            bin/*.deb
            bin/LocalTodo-linux-amd64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@$env:WAILS_VERSION
      - name: Build Windows installer
        shell: pwsh
        run: |
          $wails = Join-Path (go env GOPATH) "bin\wails3.exe"
          & $wails package INSTALL_SCOPE=user
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: bin/*-installer.exe
          if-no-files-found: error

  macos:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
      - name: Build macOS app
        run: |
          "$(go env GOPATH)/bin/wails3" package
          ditto -c -k --sequesterRsrc --keepParent bin/localtodo.app "bin/LocalTodo-macos-$(uname -m).app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: bin/LocalTodo-macos-*.app.zip
          if-no-files-found: error

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --title "LocalTodo ${GITHUB_REF_NAME}" --generate-notes --verify-tag
